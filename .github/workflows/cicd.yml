# InfraSentinel — Code Analysis Gate
name: Code Analysis
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
jobs:
  code-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Run InfraSentinel Code Analysis
        run: |
          DIFF=$(git diff HEAD~1 HEAD --unified=5 2>/dev/null || git show HEAD --unified=5)
          RESULT=$(curl -s -X POST http://43.205.209.168/api/ci/analyze \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.INFRA_SENTINEL_API_KEY }}" \
            -d "$(jq -n \
              --arg diff "$DIFF" \
              --arg branch "${{ github.ref_name }}" \
              --arg sha "${{ github.sha }}" \
              --arg msg "${{ github.event.head_commit.message }}" \
              --arg project "${{ github.repository }}" \
              '{diff:$diff,branch:$branch,commitSha:$sha,commitMessage:$msg,project:$project}')")
          echo "$RESULT" | jq '{recommendation,buildWillPass,deploymentWillWork,summary}'
          REC=$(echo "$RESULT" | jq -r '.recommendation')
          [ "$REC" = "PASS" ] || { echo "::error::Analysis failed — $REC"; exit 1; }
